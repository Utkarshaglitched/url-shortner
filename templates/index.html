<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>URL Shortener</title>
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --muted: #64748b;
        --accent: #0f172a;
        --border: #e2e8f0;
        --primary: #111827;
        --primary-hover: #1f2937;
        --secondary: #f1f5f9;
        --secondary-hover: #e2e8f0;
      }
      
      * {
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--accent);
      }

      .container {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 640px;
        background: var(--card);
        border-radius: 12px;
        padding: 32px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        border: 1px solid var(--border);
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        gap: 12px;
        flex-wrap: wrap;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
      }

      .analytics-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 8px;
        background: var(--secondary);
        color: var(--accent);
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid var(--border);
        transition: all 0.2s ease;
      }

      .analytics-link:hover {
        background: var(--secondary-hover);
        text-decoration: none;
      }

      p.lead {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 14px;
      }

      .row {
        display: flex;
        gap: 10px;
      }

      input[type="url"] {
        flex: 1;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }

      input[type="url"]:focus {
        border-color: #2563eb;
      }

      button {
        padding: 12px 18px;
        border-radius: 8px;
        border: 0;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover {
        background: var(--primary-hover);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .result {
        margin-top: 20px;
        padding: 14px;
        border-radius: 8px;
        background: #f8fafc;
        border: 1px solid var(--border);
        color: var(--accent);
        font-size: 14px;
      }

      .error {
        color: #9b1c1c;
        background: #fff5f5;
        border: 1px solid #fee2e2;
      }

      a.short {
        color: #2563eb;
        font-weight: 700;
        text-decoration: none;
      }

      a.short:hover {
        text-decoration: underline;
      }

      .small {
        font-size: 13px;
        color: var(--muted);
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="card-header">
          <h1>URL Shortener</h1>
          <a href="analytic.html" class="analytics-link">
            <span>View Analytics</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
          </a>
        </div>
        <p class="lead">Enter a long URL and get a short, shareable link.</p>

        <div>
          <div class="row">
            <input id="longUrl" type="url" placeholder="https://example.com/very/long/url" aria-label="Long URL" />
            <button id="shortenBtn">Shorten URL</button>
          </div>
          <div id="feedback" class="result" style="display:none"></div>
        </div>

        <div class="small">Backend endpoint: <code>http://127.0.0.1:8005/api/urls</code></div>
      </div>
    </div>

    <script>
      const btn = document.getElementById('shortenBtn');
      const input = document.getElementById('longUrl');
      const feedback = document.getElementById('feedback');

      function showMessage(html, isError = false){
        feedback.style.display = 'block';
        feedback.className = isError ? 'result error' : 'result';
        feedback.innerHTML = html;
      }

      btn.addEventListener('click', async ()=>{
        const longUrl = input.value.trim();
        if(!longUrl){ showMessage('Please enter a URL to shorten.', true); return; }

        btn.disabled = true; btn.textContent = 'Shortening...';
        showMessage('Sending request...');

        try{
          const endpoint = 'http://127.0.0.1:8005/api/urls';

          const resp = await fetch(endpoint, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ long_url: longUrl })
          });

          let data = null;
          try{ data = await resp.json(); } catch(e){ /* ignore parse errors */ }

          if(!resp.ok){
            const serverMsg = data && (data.msg || data.message) ? (data.msg || data.message) : (resp.statusText + ' (' + resp.status + ')');
            showMessage('Error from server: ' + serverMsg, true);
            return;
          }

          const shortPath = data && data.msg ? data.msg : null;
          if(shortPath){
            const full = 'http://127.0.0.1:8005' + shortPath;
            showMessage(`<div>Shortened URL: <a class="short" href="${full}" target="_blank" rel="noopener">${full}</a></div>`);
          } else {
            showMessage('<div>Unexpected response from server.</div><pre style="white-space:pre-wrap;margin-top:8px">' + JSON.stringify(data, null, 2) + '</pre>', true);
          }

        } catch(err){
          showMessage('Network or other error: ' + err.message, true);
        } finally{
          btn.disabled = false; btn.textContent = 'Shorten URL';
        }
      });
    </script>
  </body>
</html>
